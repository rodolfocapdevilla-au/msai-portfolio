<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="800" height="450" role="img" aria-label="Microphone and sound waves turning into a written page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2260"/><stop offset="1" stop-color="#5a46a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="290" cy="320" r="175" fill="#ffffff" opacity=".07"/>
  <!-- microphone -->
  <rect x="235" y="165" width="110" height="215" rx="55" fill="#ff8a7a"/>
  <path d="M253 220h74M253 255h74M253 290h74" stroke="#c95a50" stroke-width="10" stroke-linecap="round"/>
  <path d="M200 305a90 100 0 0 0 180 0" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <path d="M290 405v90M225 500h130" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <!-- sound wave -->
  <g stroke="#7ee0d2" stroke-width="16" stroke-linecap="round">
    <path d="M425 308v54M458 275v120M491 235v200M524 290v90M557 255v160M590 305v60M623 322v26"/>
  </g>
  <!-- arrow -->
  <path d="M650 335h60M688 308l30 27-30 27" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- transcript page -->
  <path d="M750 100h210l80 80v385a18 18 0 0 1-18 18H750a18 18 0 0 1-18-18V118a18 18 0 0 1 18-18z" fill="#fbfaff"/>
  <path d="M960 100v62a18 18 0 0 0 18 18h62z" fill="#cfc7ee"/>
  <path d="M768 165h130" stroke="#2b2260" stroke-width="18" stroke-linecap="round"/>
  <g stroke="#8f86bd" stroke-width="13" stroke-linecap="round">
    <path d="M768 225h232M768 270h195M768 315h225M768 360h70M965 360h35M768 405h215M768 450h232M768 495h150"/>
  </g>
  <!-- a word the model got wrong -->
  <path d="M862 360h78" stroke="#ff8a7a" stroke-width="13" stroke-linecap="round"/>
  <path d="M858 380q11-12 22 0t22 0 22 0 22 0" fill="none" stroke="#ff8a7a" stroke-width="5" stroke-linecap="round"/>
</svg>
