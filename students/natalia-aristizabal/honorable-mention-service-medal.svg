  <rect x="340" y="336" width="26" height="46" fill="#2B3A55"/>
  <rect x="266" y="470" width="50" height="90" rx="8" fill="#E9B83E" stroke="#2B3A55" stroke-width="4"/>
  <circle cx="304" cy="518" r="4" fill="#2B3A55"/>
  <rect x="214" y="428" width="40" height="38" rx="6" fill="#D7ECF2" stroke="#2B3A55" stroke-width="3"/>
