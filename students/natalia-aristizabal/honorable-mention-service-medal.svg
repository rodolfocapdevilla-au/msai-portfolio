<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a gold medal with a cross emblem, surrounded by a community home, hearts and children's building blocks" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF6EC"/>
      <stop offset="1" stop-color="#F6EBDA"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FBE08A"/>
      <stop offset="0.6" stop-color="#E9B83E"/>
      <stop offset="1" stop-color="#C58E1C"/>
    </radialGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3C78"/>
      <stop offset="1" stop-color="#2C55A0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C55A0"/>
      <stop offset="1" stop-color="#1F3C78"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="600" cy="360" r="300" fill="#F3E3C8" opacity="0.6"/>
  <circle cx="600" cy="360" r="215" fill="#F0DCBA" opacity="0.5"/>

