  <circle cx="865" cy="515" r="18" fill="#FFFFFF" opacity="0.9"/>
  <path d="M948 532 L965 498 L982 532 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M898 418 c0 -9 12 -12 16 -4 c4 -8 16 -5 16 4 c0 10 -16 18 -16 18 s-16 -8 -16 -18 z" fill="#FFFFFF" opacity="0.9" transform="rotate(-6 913 417)"/>
