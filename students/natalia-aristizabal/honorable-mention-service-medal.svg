  <g fill="#E9B83E" opacity="0.6"><circle cx="105" cy="470" r="5"/><circle cx="1105" cy="150" r="6"/></g>

  <!-- community home (left) -->
  <rect x="196" y="400" width="190" height="160" rx="10" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/>
