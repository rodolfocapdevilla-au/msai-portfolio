<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a MALDI-TOF mass spectrometer identifying bacteria from a blood culture bottle" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF5F9"/>
      <stop offset="1" stop-color="#E4EEF5"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE3EA"/>
      <stop offset="1" stop-color="#AEBBC7"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D24B55"/>
      <stop offset="1" stop-color="#A8303B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FF8A78" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF8A78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="960" cy="110" r="230" fill="#DCEBF3"/>
  <circle cx="190" cy="610" r="190" fill="#E2EFEA"/>
  <g fill="#C9DCE8" opacity="0.7">
    <circle cx="560" cy="90" r="4"/><circle cx="600" cy="120" r="3"/><circle cx="640" cy="80" r="5"/>
    <circle cx="700" cy="110" r="3"/><circle cx="1010" cy="400" r="4"/><circle cx="150" cy="300" r="3"/>
  </g>

  <!-- bench -->
  <rect x="0" y="560" width="1200" height="115" fill="#D3E0EA"/>
  <rect x="0" y="560" width="1200" height="6" fill="#BFD0DD"/>

  <!-- decorative bacteria outside the 4:3 safe area -->
  <rect x="50" y="380" width="78" height="28" rx="14" fill="#7C6CD6" transform="rotate(-35 89 394)"/>
  <rect x="64" y="391" width="50" height="6" rx="3" fill="#A79CEB" transform="rotate(-35 89 394)"/>
  <g fill="#2BA3A0"><circle cx="1110" cy="230" r="15"/><circle cx="1138" cy="252" r="15"/><circle cx="1150" cy="285" r="15"/></g>
  <g fill="#7C6CD6"><circle cx="1095" cy="470" r="13"/><circle cx="1121" cy="462" r="13"/><circle cx="1108" cy="490" r="13"/><circle cx="1134" cy="486" r="13"/></g>

  <!-- bacteria, upper left: rods (bacilli) -->
  <g transform="rotate(-24 250 165)">
    <rect x="205" y="150" width="92" height="32" rx="16" fill="#7C6CD6"/>
    <rect x="222" y="162" width="58" height="8" rx="4" fill="#A79CEB"/>
  </g>
  <g transform="rotate(18 300 235)">
    <rect x="262" y="222" width="80" height="28" rx="14" fill="#2BA3A0"/>
    <rect x="276" y="232" width="52" height="7" rx="3.5" fill="#6FD0CB"/>
  </g>
  <g transform="rotate(62 190 250)">
    <rect x="160" y="238" width="62" height="24" rx="12" fill="#7C6CD6" opacity="0.75"/>
  </g>

  <!-- blood culture bottle -->
  <rect x="208" y="306" width="64" height="30" rx="8" fill="#2BA3A0"/>
  <rect x="214" y="300" width="52" height="10" rx="4" fill="#1F7F7C"/>
  <rect x="218" y="334" width="44" height="40" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="4"/>
  <rect x="188" y="368" width="104" height="192" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="4"/>
  <path d="M192 448 Q215 438 240 448 T288 448 V532 Q288 556 264 556 H216 Q192 556 192 532 Z" fill="url(#blood)"/>
  <rect x="188" y="392" width="104" height="34" fill="#DCE8F0"/>
  <rect x="202" y="402" width="52" height="5" rx="2.5" fill="#9FB6C8"/>
  <rect x="202" y="413" width="34" height="5" rx="2.5" fill="#9FB6C8"/>
  <g fill="#F08A92"><circle cx="220" cy="490" r="5"/><circle cx="248" cy="512" r="4"/><circle cx="265" cy="476" r="3"/><circle cx="236" cy="530" r="3"/></g>
  <rect x="188" y="368" width="104" height="192" rx="24" fill="none" stroke="#1E3A5F" stroke-width="4"/>

  <!-- transfer arrow: sample from bottle to target plate -->
  <path d="M300 470 C 320 470 330 440 352 432" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M344 424 L356 431 L345 441" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- instrument: flight tube on top -->
  <rect x="455" y="236" width="40" height="70" fill="#1E3A5F"/>
  <rect x="410" y="186" width="470" height="60" rx="30" fill="#1E3A5F"/>
  <rect x="428" y="199" width="434" height="34" rx="17" fill="#2B4E78"/>
  <rect x="846" y="194" width="26" height="50" rx="6" fill="#F2B544"/>
  <!-- ions in flight with trails -->
  <g stroke-linecap="round" opacity="0.55" stroke-width="4">
    <line x1="500" y1="216" x2="535" y2="216" stroke="#F2B544"/>
    <line x1="585" y1="216" x2="630" y2="216" stroke="#6FD0CB"/>
    <line x1="672" y1="216" x2="700" y2="216" stroke="#FF8A78"/>
    <line x1="742" y1="216" x2="790" y2="216" stroke="#6FD0CB"/>
  </g>
  <circle cx="545" cy="216" r="9" fill="#F2B544"/>
  <circle cx="640" cy="216" r="7" fill="#6FD0CB"/>
  <circle cx="712" cy="216" r="11" fill="#FF8A78"/>
  <circle cx="800" cy="216" r="6" fill="#6FD0CB"/>

  <!-- instrument body -->
  <rect x="340" y="262" width="580" height="298" rx="26" fill="#F8FBFD" stroke="#1E3A5F" stroke-width="4"/>

  <!-- sample chamber with target plate -->
  <rect x="362" y="300" width="236" height="170" rx="16" fill="#1E3A5F"/>
  <rect x="386" y="344" width="190" height="112" rx="8" fill="url(#steel)" stroke="#8E9EAD" stroke-width="2"/>
  <g fill="#A3B1BE">
    <circle cx="410" cy="368" r="9"/><circle cx="442" cy="368" r="9"/><circle cx="474" cy="368" r="9"/><circle cx="506" cy="368" r="9"/><circle cx="538" cy="368" r="9"/>
    <circle cx="410" cy="400" r="9"/><circle cx="442" cy="400" r="9"/><circle cx="506" cy="400" r="9"/><circle cx="538" cy="400" r="9"/>
    <circle cx="410" cy="432" r="9"/><circle cx="442" cy="432" r="9"/><circle cx="474" cy="432" r="9"/><circle cx="506" cy="432" r="9"/><circle cx="538" cy="432" r="9"/>
  </g>
  <g fill="#E39AA0"><circle cx="410" cy="368" r="6"/><circle cx="442" cy="400" r="6"/><circle cx="506" cy="432" r="6"/><circle cx="538" cy="368" r="6"/></g>
  <!-- laser -->
  <rect x="372" y="308" width="44" height="18" rx="5" fill="#F26B5B"/>
  <line x1="412" y1="322" x2="474" y2="400" stroke="#FF8A78" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  <line x1="412" y1="322" x2="474" y2="400" stroke="#F26B5B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="474" cy="400" r="26" fill="url(#glow)"/>
  <circle cx="474" cy="400" r="9" fill="#F26B5B"/>
  <!-- ions rising into the tube -->
  <circle cx="476" cy="372" r="4" fill="#F2B544"/>
  <circle cx="472" cy="346" r="5" fill="#6FD0CB"/>
  <circle cx="477" cy="320" r="4" fill="#FF8A78"/>

  <!-- screen with mass spectrum -->
  <rect x="624" y="300" width="270" height="170" rx="14" fill="#0F2A44"/>
  <line x1="646" y1="440" x2="872" y2="440" stroke="#3E6A8F" stroke-width="2"/>
  <g stroke="#24425F" stroke-width="1"><line x1="646" y1="400" x2="872" y2="400"/><line x1="646" y1="360" x2="872" y2="360"/></g>
  <path d="M646 440 H676 L684 404 L692 440 H716 L724 340 L732 440 H756 L762 414 L768 440 H788 L796 372 L804 440 H828 L834 424 L840 440 H872" fill="none" stroke="#2BD4C4" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="724" cy="340" r="5" fill="#F2B544"/>
  <circle cx="860" cy="326" r="15" fill="#2BA3A0"/>
  <path d="M852 326 L858 332 L869 319" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- control strip -->
  <rect x="362" y="490" width="532" height="44" rx="12" fill="#E6EEF4"/>
  <circle cx="392" cy="512" r="8" fill="#2BA3A0"/>
  <circle cx="420" cy="512" r="8" fill="#F2B544"/>
  <rect x="452" y="507" width="120" height="10" rx="5" fill="#C9D6E1"/>
  <rect x="780" y="504" width="92" height="16" rx="8" fill="#1E3A5F"/>

  <!-- bacteria, lower right: cocci -->
  <g fill="#F26B5B">
    <circle cx="975" cy="300" r="14"/><circle cx="992" cy="324" r="14"/><circle cx="1004" cy="352" r="14"/><circle cx="1010" cy="382" r="14"/>
  </g>
  <g fill="#7C6CD6">
    <circle cx="972" cy="500" r="13"/><circle cx="998" cy="494" r="13"/><circle cx="985" cy="520" r="13"/><circle cx="1011" cy="516" r="13"/><circle cx="1000" cy="540" r="13"/>
  </g>
  <g transform="rotate(-12 990 440)">
    <rect x="955" y="428" width="70" height="24" rx="12" fill="#2BA3A0"/>
    <rect x="968" y="437" width="44" height="6" rx="3" fill="#6FD0CB"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
