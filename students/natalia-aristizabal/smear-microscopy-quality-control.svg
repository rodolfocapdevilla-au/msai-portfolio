<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a microscope, glass slides, a magnified view of red acid-fast bacilli on a blue field, and a quality-control checklist" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16394A"/>
      <stop offset="1" stop-color="#0E2A37"/>
    </linearGradient>
    <radialGradient id="field" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5B8FE6"/>
      <stop offset="0.7" stop-color="#3666C4"/>
      <stop offset="1" stop-color="#244E9E"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F6F9"/>
      <stop offset="1" stop-color="#C9D5DE"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="745" cy="300" r="180"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#bgd)"/>
  <g fill="#1D4B5E" opacity="0.8">
    <circle cx="140" cy="110" r="70"/><circle cx="1090" cy="560" r="90"/>
  </g>
  <g fill="#2A6177" opacity="0.6">
    <circle cx="60" cy="520" r="6"/><circle cx="1140" cy="120" r="5"/><circle cx="1110" cy="300" r="4"/><circle cx="90" cy="330" r="4"/>
  </g>

  <!-- bench -->
  <rect x="0" y="575" width="1200" height="100" fill="#0B2230"/>
  <rect x="0" y="575" width="1200" height="5" fill="#24546A"/>

  <!-- magnifier rays from eyepiece/objective to lens view -->
  <path d="M405 300 L575 150 M405 330 L575 450" stroke="#7FC8C2" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.7"/>

  <!-- microscope -->
  <g stroke="#0B2230" stroke-width="4" stroke-linejoin="round">
    <rect x="220" y="532" width="230" height="44" rx="14" fill="url(#metal)"/>
    <path d="M370 532 C 420 470 420 330 360 250 L330 270 C 380 340 380 460 340 532 Z" fill="#E6EDF2"/>
    <rect x="236" y="430" width="200" height="22" rx="6" fill="url(#metal)"/>
    <rect x="300" y="452" width="56" height="24" rx="6" fill="#C9D5DE"/>
    <g transform="rotate(-28 320 270)">
      <rect x="290" y="180" width="62" height="150" rx="12" fill="url(#metal)"/>
      <rect x="298" y="140" width="46" height="46" rx="8" fill="#2BA3A0"/>
      <rect x="306" y="120" width="30" height="24" rx="6" fill="#E6EDF2"/>
    </g>
    <rect x="300" y="350" width="44" height="44" rx="8" fill="#2BA3A0"/>
    <rect x="310" y="392" width="24" height="36" rx="6" fill="url(#metal)"/>
    <circle cx="395" cy="470" r="18" fill="#2BA3A0"/>
  </g>
  <!-- slide on the stage -->
  <rect x="256" y="422" width="140" height="10" rx="3" fill="#BFE6F2" stroke="#0B2230" stroke-width="2"/>
  <ellipse cx="324" cy="427" rx="26" ry="3" fill="#E0457B" opacity="0.8"/>
  <!-- light under stage -->
  <circle cx="322" cy="500" r="10" fill="#F6D776"/>

  <!-- glass slides on bench -->
  <g transform="rotate(-8 520 545)">
    <rect x="455" y="525" width="150" height="40" rx="4" fill="#D5EEF6" stroke="#0B2230" stroke-width="3"/>
    <rect x="455" y="525" width="36" height="40" fill="#F2F6F9" stroke="#0B2230" stroke-width="3"/>
    <ellipse cx="548" cy="545" rx="34" ry="11" fill="#E0457B" opacity="0.75"/>
  </g>
  <g transform="rotate(6 560 590)">
    <rect x="490" y="570" width="150" height="40" rx="4" fill="#D5EEF6" stroke="#0B2230" stroke-width="3"/>
    <rect x="490" y="570" width="36" height="40" fill="#F2F6F9" stroke="#0B2230" stroke-width="3"/>
    <ellipse cx="583" cy="590" rx="34" ry="11" fill="#3666C4" opacity="0.6"/>
  </g>

  <!-- magnified view -->
  <circle cx="745" cy="300" r="196" fill="#0B2230"/>
  <circle cx="745" cy="300" r="186" fill="#E6EDF2"/>
  <circle cx="745" cy="300" r="180" fill="url(#field)"/>
  <g clip-path="url(#lens)">
    <!-- blue background cells -->
    <g fill="#7FA6EE" opacity="0.45">
      <ellipse cx="640" cy="220" rx="34" ry="22"/><ellipse cx="830" cy="190" rx="40" ry="26"/>
      <ellipse cx="700" cy="400" rx="38" ry="24"/><ellipse cx="860" cy="380" rx="30" ry="20"/>
      <ellipse cx="760" cy="300" rx="26" ry="18"/><ellipse cx="610" cy="330" rx="24" ry="16"/>
    </g>
    <!-- red acid-fast bacilli -->
    <g fill="#F0457E" stroke="#B0225A" stroke-width="2">
      <rect x="660" y="250" width="58" height="13" rx="6.5" transform="rotate(-30 689 256)"/>
      <rect x="700" y="262" width="52" height="12" rx="6" transform="rotate(20 726 268)"/>
      <rect x="790" y="240" width="62" height="13" rx="6.5" transform="rotate(55 821 246)"/>
      <rect x="760" y="340" width="56" height="12" rx="6" transform="rotate(-12 788 346)"/>
      <rect x="640" y="360" width="50" height="12" rx="6" transform="rotate(70 665 366)"/>
      <rect x="820" y="320" width="48" height="12" rx="6" transform="rotate(-48 844 326)"/>
      <rect x="700" y="180" width="54" height="12" rx="6" transform="rotate(8 727 186)"/>
      <rect x="730" y="420" width="52" height="12" rx="6" transform="rotate(-62 756 426)"/>
    </g>
    <!-- beading highlights -->
    <g fill="#FFB3CC">
      <circle cx="680" cy="262" r="2.5"/><circle cx="698" cy="251" r="2.5"/>
      <circle cx="815" cy="236" r="2.5"/><circle cx="827" cy="255" r="2.5"/>
      <circle cx="775" cy="349" r="2.5"/><circle cx="798" cy="344" r="2.5"/>
    </g>
    <path d="M610 170 A180 180 0 0 1 760 120" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.18"/>
  </g>

  <!-- QC clipboard -->
  <g transform="rotate(5 945 470)">
    <rect x="870" y="370" width="160" height="200" rx="14" fill="#F6D776" stroke="#0B2230" stroke-width="4"/>
    <rect x="884" y="392" width="132" height="166" rx="6" fill="#FFFFFF"/>
    <rect x="915" y="358" width="70" height="26" rx="8" fill="#2BA3A0" stroke="#0B2230" stroke-width="3"/>
    <g>
      <rect x="898" y="414" width="22" height="22" rx="5" fill="#E2F4F2" stroke="#2BA3A0" stroke-width="3"/>
      <path d="M903 425 L908 431 L917 418" fill="none" stroke="#1F8A86" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="930" y="420" width="70" height="9" rx="4.5" fill="#C9D5DE"/>
      <rect x="898" y="460" width="22" height="22" rx="5" fill="#E2F4F2" stroke="#2BA3A0" stroke-width="3"/>
      <path d="M903 471 L908 477 L917 464" fill="none" stroke="#1F8A86" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="930" y="466" width="58" height="9" rx="4.5" fill="#C9D5DE"/>
      <rect x="898" y="506" width="22" height="22" rx="5" fill="#E2F4F2" stroke="#2BA3A0" stroke-width="3"/>
      <path d="M903 517 L908 523 L917 510" fill="none" stroke="#1F8A86" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="930" y="512" width="66" height="9" rx="4.5" fill="#C9D5DE"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
